name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish screenshots to the simulator-screenshots branch

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Typo.xcodeproj \
            -scheme Typo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Summarise errors and warnings
        if: always()
        run: |
          {
            echo "## Build errors"
            grep -E "error: " build.log | sed 's#^.*/Typo/##' | sort -u | head -300 || echo "None"
            echo
            echo "## Notable warnings"
            grep -E "warning: .*(deprecated|unavailable|never|isolat|Sendable)" build.log | sed 's#^.*/Typo/##' | sort -u | head -100 || echo "None"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Simulator screenshots
        id: shots
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d for rt, ds in data.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if d["name"] == "iPhone 17 Pro"), None) or next((d for d in phones if "iPhone 17" in d["name"]), None) or phones[-1]
          print(pick["udid"])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          APP=build/Build/Products/Debug-iphonesimulator/Typo.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() {  # name, then launch arguments
            NAME=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" -TypoDemoData YES "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$NAME.png"
            echo "app running? $(xcrun simctl spawn "$UDID" launchctl list | grep -c "$BUNDLE")"
          }
          shoot 01-library
          shoot 02-collection -TypoCollection YES
          shoot 03-codes -TypoRoute codes
          shoot 04-quicksave -TypoRoute quicksave
          shoot 05-dictate -TypoRoute dictate
          shoot 06-vault -TypoRoute vault
          shoot 07-sync -TypoRoute sync
          shoot 08-newcode -TypoRoute newcode
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Typo"' --style compact > shots/app-log.txt || true
          (cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/shots/Typo-simulator.app.zip" Typo.app)

      - name: Show app log
        if: always()
        run: |
          echo "--- last lines of the app's log"
          tail -n 80 shots/app-log.txt 2>/dev/null || echo "(no app log)"
          echo "--- screenshots taken"
          ls -la shots/*.png 2>/dev/null || echo "(none)"

      - name: Publish screenshots to a branch
        if: always()
        run: |
          [ -n "$(ls shots/*.png 2>/dev/null)" ] || { echo "no screenshots to publish"; exit 0; }
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp shots/*.png shots/app-log.txt /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub        # a separate folder, so the project checkout is left untouched
          git init -q -b simulator-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" simulator-screenshots

      - name: Also compile the full version (keyboard, share, widgets; unsigned)
        if: always()
        run: |
          set -o pipefail
          xcodegen generate --spec project-full.yml
          xcodebuild -project Typo.xcodeproj -scheme Typo -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-full \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-full.log | grep -E "error: |BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-full.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
          if-no-files-found: ignore
