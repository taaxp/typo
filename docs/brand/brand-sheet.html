<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><title>Typo brand</title>
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .full{width:1024px;height:1024px}
  .full img{width:1024px;height:1024px;display:block}
  .pres{width:640px;height:640px;display:flex;align-items:center;justify-content:center;background:transparent}
  .pres img{width:460px;height:460px;border-radius:103px;box-shadow:0 30px 60px rgba(40,40,110,.28),0 0 0 .5px rgba(0,0,0,.08)}
  .lock{width:1400px;height:560px;display:flex;align-items:center;justify-content:center;gap:56px;position:relative;overflow:hidden}
  .lock img{width:260px;height:260px;border-radius:58px;box-shadow:0 22px 50px rgba(40,40,110,.28)}
  .word{font-family:"Inter Display",Inter;font-weight:700;font-size:200px;letter-spacing:-8px;line-height:1}
  .tag{font-size:30px;font-weight:500;margin-top:16px;letter-spacing:-.3px}
  .light{background:#F6F6FA}
  .light .word{background:linear-gradient(120deg,#3F318F,#213A9E 55%,#135E6C);-webkit-background-clip:text;color:transparent}
  .light .tag{color:#6B6B78}
  .dark{background:#0B0B12}
  .dark .word{background:linear-gradient(120deg,#C7B6F2,#8FB8FF 55%,#8EE3E0);-webkit-background-clip:text;color:transparent}
  .dark .tag{color:#9A9AAA}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35}
  .sizes{width:1100px;height:300px;background:#F6F6FA;display:flex;align-items:flex-end;justify-content:center;gap:48px;padding-bottom:50px}
  .sizes div{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:16px;color:#6B6B78}
  .sizes img{box-shadow:0 6px 16px rgba(40,40,110,.2)}
</style></head><body>
<div class="full" id="icon"><img src="typo-icon.svg"></div>
<div class="pres" id="mark"><img src="typo-icon.svg"></div>
<div class="lock light" id="lockup-light">
  <div class="blob" style="width:520px;height:520px;background:#C7B6F2;left:-120px;top:-180px"></div>
  <div class="blob" style="width:520px;height:520px;background:#8EE3E0;right:-140px;bottom:-220px"></div>
  <img src="typo-icon.svg"><div><div class="word">Typo</div><div class="tag">Everything you type again, one tap away.</div></div></div>
<div class="lock dark" id="lockup-dark">
  <div class="blob" style="width:520px;height:520px;background:#7C6AD6;left:-120px;top:-180px"></div>
  <div class="blob" style="width:520px;height:520px;background:#2F9FB4;right:-140px;bottom:-220px"></div>
  <img src="typo-icon.svg"><div><div class="word">Typo</div><div class="tag">Everything you type again, one tap away.</div></div></div>
<div class="sizes" id="sizes">
  <div><img src="typo-icon.svg" style="width:180px;height:180px;border-radius:40px">180 pt</div>
  <div><img src="typo-icon.svg" style="width:120px;height:120px;border-radius:27px">120 pt</div>
  <div><img src="typo-icon.svg" style="width:60px;height:60px;border-radius:13.5px">60 pt</div>
  <div><img src="typo-icon.svg" style="width:40px;height:40px;border-radius:9px">40 pt</div>
  <div><img src="typo-icon.svg" style="width:29px;height:29px;border-radius:6.5px">29 pt</div>
</div>
</body></html>
