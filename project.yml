# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate
# Then open Stash.xcodeproj, set your Team on every target, and run.
#
# Change these three values before your first build:
#   BUNDLE_ID_PREFIX  – reverse-DNS prefix you own
#   APP_GROUP_ID      – must match Shared/Persistence/AppGroup.swift
#   ICLOUD_CONTAINER  – must match Shared/Persistence/AppGroup.swift

name: Stash

options:
  bundleIdPrefix: com.starconnect
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID_PREFIX: com.starconnect.stash
    APP_GROUP_ID: group.com.starconnect.stash
    ICLOUD_CONTAINER: iCloud.com.starconnect.stash
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode for the first build: the code hasn't been compiled yet,
    # and Swift 6 mode turns every Sendable warning into an error. Move to 6.0 later.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set in Xcode, or here
    CODE_SIGN_STYLE: Automatic

targets:

  # ---------------------------------------------------------------- iPhone / iPad app
  Stash:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/Stash-iOS.entitlements
        INFOPLIST_FILE: Config/Stash-iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: StashKeyboard
      - target: StashShare
      - target: StashWidgets

  # ---------------------------------------------------------------- Mac app
  StashMac:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_NAME: Stash
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        CODE_SIGN_ENTITLEMENTS: Config/Stash-macOS.entitlements
        INFOPLIST_FILE: Config/Stash-macOS-Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---------------------------------------------------------------- Custom keyboard (iOS)
  StashKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: Shared
        excludes:
          - "Intents/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).keyboard
        CODE_SIGN_ENTITLEMENTS: Config/StashExtension.entitlements
        INFOPLIST_FILE: Config/StashKeyboard-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  # ---------------------------------------------------------------- Share extension (iOS)
  StashShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - path: Shared
        excludes:
          - "Intents/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
        CODE_SIGN_ENTITLEMENTS: Config/StashExtension.entitlements
        INFOPLIST_FILE: Config/StashShare-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  # ---------------------------------------------------------------- Control Centre + Lock Screen (iOS)
  StashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/Intents/OpenQuickSaveIntent.swift
      - Shared/Persistence/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        CODE_SIGN_ENTITLEMENTS: Config/StashExtension.entitlements
        INFOPLIST_FILE: Config/StashWidgets-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
