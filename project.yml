# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate
# Then open Typo.xcodeproj, set your Team on every target, and run.
#
# Change these three values before your first build:
#   BUNDLE_ID_PREFIX  – reverse-DNS prefix you own
#   APP_GROUP_ID      – must match Shared/Persistence/AppGroup.swift
#   ICLOUD_CONTAINER  – must match Shared/Persistence/AppGroup.swift

name: Typo

options:
  bundleIdPrefix: com.starconnect
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID_PREFIX: com.starconnect.typo
    APP_GROUP_ID: group.com.starconnect.typo
    MAC_APP_GROUP_ID: com.starconnect.typo       # Mac groups are prefixed with your Team ID
    ICLOUD_CONTAINER: iCloud.com.starconnect.typo
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode for the first build: the code hasn't been compiled yet,
    # and Swift 6 mode turns every Sendable warning into an error. Move to 6.0 later.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set in Xcode, or here
    CODE_SIGN_STYLE: Automatic

targets:

  # ---------------------------------------------------------------- iPhone / iPad app
  Typo:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/Typo-iOS.entitlements
        INFOPLIST_FILE: Config/Typo-iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TypoKeyboard
      - target: TypoShare
      - target: TypoWidgets
      # iOS-first: the Apple Watch app is left out of the first CI builds so they
      # don't depend on watchOS simulator SDKs. Restore once iOS builds cleanly:
      # - target: TypoWatch        # check it lands in "Embed Watch Content" after generating

  # ---------------------------------------------------------------- Mac app
  TypoMac:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_NAME: Typo
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        CODE_SIGN_ENTITLEMENTS: Config/Typo-macOS.entitlements
        INFOPLIST_FILE: Config/Typo-macOS-Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TypoMacShare
    scheme:
      testTargets:
        - TypoTests

  # ---------------------------------------------------------------- Custom keyboard (iOS)
  TypoKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: Shared
        excludes:
          - "Intents/**"
          - "Codes/**"     # extensions never draw codes
          - "Vault/**"     # extensions never see payment cards or Wi-Fi passwords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).keyboard
        CODE_SIGN_ENTITLEMENTS: Config/TypoExtension.entitlements
        INFOPLIST_FILE: Config/TypoKeyboard-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  # ---------------------------------------------------------------- Share extension (iOS)
  TypoShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - path: Shared
        excludes:
          - "Intents/**"
          - "Codes/**"     # extensions never draw codes
          - "Vault/**"     # extensions never see payment cards or Wi-Fi passwords
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
        CODE_SIGN_ENTITLEMENTS: Config/TypoExtension.entitlements
        INFOPLIST_FILE: Config/TypoShare-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  # ---------------------------------------------------------------- Control Centre + Lock Screen (iOS)
  TypoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared/Intents/OpenQuickSaveIntent.swift
      - Shared/Persistence/AppGroup.swift
      - Shared/Codes/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        CODE_SIGN_ENTITLEMENTS: Config/TypoExtension.entitlements
        INFOPLIST_FILE: Config/TypoWidgets-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  # ---------------------------------------------------------------- Mac share extension
  TypoMacShare:
    type: app-extension
    platform: macOS
    sources:
      - MacShare
      - Share/ShareView.swift
      - path: Shared
        excludes:
          - "Intents/**"
          - "Codes/**"
          - "Vault/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).macshare
        CODE_SIGN_ENTITLEMENTS: Config/TypoMacShare.entitlements
        INFOPLIST_FILE: Config/TypoMacShare-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_HARDENED_RUNTIME: YES

  # ---------------------------------------------------------------- Apple Watch app
  # The iPhone renders codes and sends them with WatchConnectivity; the watch has
  # no Core Image, CloudKit store or Keychain access to vault items.
  TypoWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared/Watch/WatchPack.swift
      - Shared/Persistence/AppGroup.swift
      - Shared/Design/Hue.swift
    settings:
      base:
        PRODUCT_NAME: Typo
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp
        CODE_SIGN_ENTITLEMENTS: Config/TypoWatch.entitlements
        INFOPLIST_FILE: Config/TypoWatch-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TypoWatchWidgets

  TypoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
      - Shared/Watch/WatchPack.swift
      - Shared/Persistence/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: Config/TypoWatchWidgets.entitlements
        INFOPLIST_FILE: Config/TypoWatchWidgets-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES

  # ---------------------------------------------------------------- Unit tests (run on the Mac app)
  # Pure logic (payloads, Wi-Fi escaping, card numbers, EAN) plus render-then-scan
  # checks for every QR style preset. Run with ⌘U on the TypoMac scheme.
  TypoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: TypoMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Typo.app/Contents/MacOS/Typo
        BUNDLE_LOADER: $(TEST_HOST)
