# SIMPLE version, for a free Apple ID (no paid developer account needed).
#   brew install xcodegen && xcodegen generate && open Typo.xcodeproj
# One app target, no entitlements: no iCloud sync, keyboard, share sheet or widgets.
# Everything else works, stored on the phone. For the full version use project-full.yml.

name: Typo

options:
  bundleIdPrefix: com.asifazad
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID_PREFIX: com.asifazad.typo
    APP_GROUP_ID: group.com.asifazad.typo
    ICLOUD_CONTAINER: iCloud.com.asifazad.typo
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode: Swift 6 mode turns every Sendable warning into an error.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # leave blank: pick your Personal Team in Xcode
    CODE_SIGN_STYLE: Automatic

targets:
  Typo:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Config/TypoLite-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
